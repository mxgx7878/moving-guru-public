<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community — Moving Guru</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/brand-lime.css" />
    
  </head>
  <body>

    <!-- ═══════ NAVBAR (injected by navbar.js — includes Pricing) ═══════ -->
    <div id="mg-navbar"></div>

    <!-- ═══════ PAGE HERO ═══════ -->
    <div class="page-hero">
      <div class="page-hero-img">
        <img src="images/group.jpg" alt="Community member" />
        <div class="page-hero-overlay"></div>
      </div>
      <div class="page-hero-content">
        <h1>The <span>Community</span></h1>
        <p>
          Meet the instructors and studios already connected on the Moving Guru
          network.
        </p>
      </div>
    </div>

    <!-- ═══════ PROFILES ═══════ -->
    <section class="section">
      <div class="section-inner">
        <!-- Discipline filter tabs -->
        <div class="reveal" style="margin-bottom: 40px">
          <p
            style="
              font-size: 12px;
              color: var(--text-light);
              text-transform: uppercase;
              letter-spacing: 1.5px;
              font-weight: 600;
              margin-bottom: 14px;
            "
          >
            Filter by Discipline
          </p>
          <div class="disc-tabs" id="communityDiscFilter"></div>
        </div>

        <!-- Profile cards -->
        <div class="profiles-grid" id="communityGrid"></div>
      </div>
    </section>

    <!-- ═══════ CTA ═══════ -->
    <section class="section bg-dark cta-section" style="padding: 120px 40px">
      <div class="reveal">
        <h2>Join the <span>network</span></h2>
        <p>
          Create your profile and start connecting with studios and instructors
          worldwide.
        </p>
        <div class="cta-buttons">
          <button class="btn-cta-primary" onclick="openModal('signup')">
            Create Profile
          </button>
          <a href="how-it-works.html" class="btn-cta-outline">Learn More</a>
        </div>
      </div>
    </section>

    <!-- ═══════ FOOTER ═══════ -->
    <div id="mg-footer"></div>

    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/main.js"></script>
    <script src="js/translate.js"></script>
  </body>
</html>
